<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0d1117"/>

  <!-- Outer ring (case file accent) -->
  <rect x="48" y="48" width="416" height="416" rx="64" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- Big "CF" monogram - Case File -->
  <g transform="translate(256 256)">
    <!-- Magnifying glass circle -->
    <circle cx="-40" cy="-40" r="120" fill="none" stroke="#e6edf3" stroke-width="18"/>
    <!-- Magnifying glass handle -->
    <line x1="55" y1="55" x2="150" y2="150" stroke="#e6edf3" stroke-width="22" stroke-linecap="round"/>
    <!-- Crimson stamp accent inside the glass -->
    <text x="-40" y="-15" text-anchor="middle"
          font-family="Georgia, serif" font-weight="900" font-size="120"
          fill="#c93030" letter-spacing="-4">C</text>
  </g>

  <!-- Confidential stamp at bottom -->
  <g transform="translate(256 432) rotate(-3)">
    <rect x="-110" y="-18" width="220" height="36" rx="3" fill="none" stroke="#c93030" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle"
          font-family="JetBrains Mono, monospace" font-weight="700" font-size="18"
          fill="#c93030" letter-spacing="3">CONFIDENTIAL</text>
  </g>
</svg>
